server:
  port: ${SERVER_PORT:8087}

spring:
  application:
    name: ms-pagos
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/ecommerce_db}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        # Base de datos por servicio: las tablas de pagos viven en su propio schema
        default_schema: ${DB_SCHEMA:pagos}
        hbm2ddl:
          create_namespaces: true
  security:
    oauth2:
      resourceserver:
        jwt:
          tenant-id: ${AZURE_TENANT_ID}
          client-id: ${AZURE_CLIENT_ID}
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: ${SPRING_KAFKA_CONSUMER_GROUP_ID:ms-pagos-antifraude}
      auto-offset-reset: earliest
    listener:
      missing-topics-fatal: false
    admin:
      fail-fast: false
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}

services:
  ordenes:
    url: ${ORDENES_SERVICE_URL:http://localhost:8084/api/v1/ordenes}

transbank:
  commerce-code: ${TRANSBANK_COMMERCE_CODE:597055555532}
  api-key: ${TRANSBANK_API_KEY:}
  environment: ${TRANSBANK_ENVIRONMENT:integration}
  return-url: ${TRANSBANK_RETURN_URL:http://localhost:8087/api/pagos/retorno}

app:
  frontend-url: ${FRONTEND_URL:http://localhost:5173}

pagos:
  kafka:
    partitions: ${KAFKA_TOPIC_PARTITIONS:3}
    replicas: ${KAFKA_TOPIC_REPLICAS:1}
    topics:
      intentos: ${TOPIC_PAGOS_INTENTOS:pagos.intentos}
      resultados: ${TOPIC_PAGOS_RESULTADOS:pagos.resultados}
      alertas: ${TOPIC_PAGOS_ALERTAS:pagos.alertas-fraude}

fraud:
  cleanup-delay-ms: ${FRAUD_CLEANUP_DELAY_MS:3600000}
  max-attempts: ${FRAUD_MAX_ATTEMPTS:3}
  window-seconds: ${FRAUD_WINDOW_SECONDS:10}
  block-minutes: ${FRAUD_BLOCK_MINUTES:30}

pedidos360:
  exchange: ${RABBITMQ_EXCHANGE:pedidos360.exchange}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
  health:
    # RabbitMQ es opcional (solo auditoría): su caída no debe marcar el servicio como DOWN
    rabbit:
      enabled: false

logging:
  level:
    root: INFO
    org.apache.kafka: WARN
