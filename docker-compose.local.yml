# =============================================================================
# Override para correr en un PC (sin AWS): agrega DynamoDB Local.
#   docker compose -f docker-compose.yml -f docker-compose.local.yml up -d --build
# En la EC2 NO se usa este archivo: ms-recomendaciones va contra DynamoDB real.
# =============================================================================
services:
  dynamodb-local:
    image: amazon/dynamodb-local:latest
    container_name: ecommerce-dynamodb-local
    command: ["-jar", "DynamoDBLocal.jar", "-sharedDb", "-inMemory"]
    ports:
      - "8000:8000"
    networks:
      - ecommerce-network

  ms-recomendaciones:
    environment:
      DYNAMODB_ENDPOINT: http://dynamodb-local:8000
      # DynamoDB Local acepta cualquier credencial
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
    depends_on:
      dynamodb-local:
        condition: service_started
