name: Deploy Backend_dev03 (Kafka + ms-pagos + ms-recomendaciones) via SSM

on:
  push:
    branches:
      - deploy
  workflow_dispatch:

env:
  AWS_REGION: us-east-1

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar JDK 17 (compilar y ejecutar tests antes de construir imágenes)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Tests ms-pagos
        run: mvn -B -q -f ms-pagos/pom.xml test

      - name: Tests ms-recomendaciones
        run: mvn -B -q -f ms-recomendaciones/pom.xml test

      - name: Configurar credenciales de AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Iniciar sesión en AWS ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Garantizar existencia de repositorios en ECR
        run: |
          for repo in ms-pagos ms-recomendaciones; do
            aws ecr describe-repositories --repository-names $repo --region ${{ env.AWS_REGION }} || \
            aws ecr create-repository --repository-name $repo --region ${{ env.AWS_REGION }}
          done

      - name: Construir y subir imágenes a AWS ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          for svc in ms-pagos ms-recomendaciones; do
            docker build -t $ECR_REGISTRY/$svc:$IMAGE_TAG -t $ECR_REGISTRY/$svc:latest ./$svc
            docker push $ECR_REGISTRY/$svc:$IMAGE_TAG
            docker push $ECR_REGISTRY/$svc:latest
          done

      - name: Generar .env de despliegue
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          cat > deploy.env <<EOF
          ECR_REGISTRY=${ECR_REGISTRY}
          KAFKA_ADVERTISED_HOST=${{ secrets.KAFKA_ADVERTISED_HOST }}
          DATASOURCE_URL=${{ secrets.DATASOURCE_URL }}
          POSTGRES_USER=${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
          AZURE_TENANT_ID=${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID=${{ secrets.AZURE_CLIENT_ID }}
          CORS_ALLOWED_ORIGINS=${{ secrets.CORS_ALLOWED_ORIGINS }}
          ORDENES_SERVICE_URL=${{ secrets.ORDENES_SERVICE_URL }}
          PRODUCTOS_SERVICE_URL=${{ secrets.PRODUCTOS_SERVICE_URL }}
          FRONTEND_URL=${{ secrets.FRONTEND_URL }}
          TRANSBANK_COMMERCE_CODE=${{ secrets.TRANSBANK_COMMERCE_CODE || '597055555532' }}
          TRANSBANK_API_KEY=${{ secrets.TRANSBANK_API_KEY }}
          TRANSBANK_ENVIRONMENT=${{ secrets.TRANSBANK_ENVIRONMENT || 'integration' }}
          TRANSBANK_RETURN_URL=${{ secrets.TRANSBANK_RETURN_URL }}
          AWS_REGION=${{ env.AWS_REGION }}
          DYNAMODB_TABLE=${{ secrets.DYNAMODB_TABLE || 'pedidos360-recomendaciones' }}
          EOF
          # Elimina los espacios en blanco al inicio de cada línea
          sed -i 's/^[ \t]*//' deploy.env

      - name: Transferir Compose/.env y Desplegar vía SSM
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          COMPOSE_BASE64=$(base64 -w 0 docker-compose.yml)
          ENV_BASE64=$(base64 -w 0 deploy.env)

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ secrets.EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --parameters commands="[
              \"set -e\",
              \"aws ecr get-login-password --region ${{ env.AWS_REGION }} | docker login --username AWS --password-stdin ${ECR_REGISTRY}\",
              \"docker network create ecommerce-network || true\",
              \"mkdir -p /home/ec2-user/app-dev03\",
              \"echo ${COMPOSE_BASE64} | base64 -d > /home/ec2-user/app-dev03/docker-compose.yml\",
              \"echo ${ENV_BASE64} | base64 -d > /home/ec2-user/app-dev03/.env\",
              \"chown -R ec2-user:ec2-user /home/ec2-user/app-dev03\",
              \"chmod 600 /home/ec2-user/app-dev03/.env\",
              \"cd /home/ec2-user/app-dev03\",
              \"docker compose pull\",
              \"docker compose up -d --no-build --remove-orphans\"
            ]" \
            --region ${{ env.AWS_REGION }} \
            --query "Command.CommandId" \
            --output text)

          echo "Comando SSM enviado con ID: $COMMAND_ID"

          # Espera a que termine (sin abortar el script aún para poder leer los logs)
          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
            --region ${{ env.AWS_REGION }} || true

          # Obtiene el estado y los logs de salida de la EC2
          STATUS=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
            --region ${{ env.AWS_REGION }} \
            --query "Status" \
            --output text)

          echo "=== ESTADO SSM: $STATUS ==="
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
            --region ${{ env.AWS_REGION }} \
            --query "{Stdout:StandardOutputContent,Stderr:StandardErrorContent}" \
            --output yaml

          # Si el comando en EC2 no fue exitoso, falla el paso en GitHub Actions
          if [ "$STATUS" != "Success" ]; then
            echo "Error: El despliegue en SSM falló con estado $STATUS"
            exit 1
          fi
