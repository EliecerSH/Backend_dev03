server:
  port: ${SERVER_PORT:8088}

spring:
  application:
    name: ms-recomendaciones
  security:
    oauth2:
      resourceserver:
        jwt:
          tenant-id: ${AZURE_TENANT_ID}
          client-id: ${AZURE_CLIENT_ID}
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: ${SPRING_KAFKA_CONSUMER_GROUP_ID:ms-recomendaciones}
      auto-offset-reset: earliest
    listener:
      missing-topics-fatal: false
    admin:
      fail-fast: false

recomendaciones:
  dynamodb:
    # Tabla única: historial por usuario, popularidad diaria, co-ocurrencia y deduplicación
    table: ${DYNAMODB_TABLE:pedidos360-recomendaciones}
    region: ${AWS_REGION:us-east-1}
    # Vacío en AWS. Para DynamoDB Local: http://dynamodb-local:8000
    endpoint: ${DYNAMODB_ENDPOINT:}
    create-table: ${DYNAMODB_CREATE_TABLE:true}
    # Días que DynamoDB conserva cada interacción antes de borrarla por TTL
    ttl-dias: ${DYNAMODB_TTL_DIAS:60}
  kafka:
    partitions: ${KAFKA_TOPIC_PARTITIONS:3}
    replicas: ${KAFKA_TOPIC_REPLICAS:1}
    topics:
      interacciones: ${TOPIC_INTERACCIONES:recomendaciones.interacciones}
      pagos-resultados: ${TOPIC_PAGOS_RESULTADOS:pagos.resultados}
  # Ventana para calcular popularidad e historial del usuario
  ventana-dias: ${RECOMENDACIONES_VENTANA_DIAS:30}
  catalogo:
    refresh-ms: ${CATALOGO_REFRESH_MS:300000}

services:
  productos:
    url: ${PRODUCTOS_SERVICE_URL:http://localhost:8082/api/v1/productos}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    root: INFO
    org.apache.kafka: WARN
